<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEMO一键生成</title>
    <link rel="stylesheet" href="style.css?v=20260707-enterprise-neutral" />
  </head>
  <body>
    <div id="lockScreen" class="lock-screen" hidden>
      <form id="unlockForm" class="lock-card">
        <div class="brand-mark">UU</div>
        <h1>DEMO一键生成</h1>
        <p>请输入访问密码</p>
        <input id="accessPassword" type="password" placeholder="访问密码" autocomplete="current-password" />
        <button type="submit">进入</button>
        <div id="unlockMessage" class="message"></div>
      </form>
    </div>

    <main class="app-shell">
      <header class="hero">
        <div class="brand-mark">UU</div>
        <div>
          <p class="eyebrow">DEMO FAST CREATE</p>
          <div class="title-row">
            <h1>DEMO一键生成</h1>
            <span class="version-tag">1.1</span>
          </div>
        </div>
      </header>

      <section class="left">
        <section class="panel upload-panel">
          <div class="section-head">
            <div class="step-badge">1</div>
            <div>
              <p class="section-label">上传参考图</p>
              <h2>KV 和产品图</h2>
            </div>
          </div>

          <div class="upload-grid">
            <label class="drop-card">
              <input id="referenceImage" type="file" accept="image/*" />
              <div id="referencePreview" class="drop-preview">
                <span class="drop-icon">KV</span>
                <strong>参考 KV 图</strong>
                <small>点击或拖拽上传</small>
              </div>
            </label>

            <label class="drop-card">
              <input id="productImage" type="file" accept="image/*" />
              <div id="productPreview" class="drop-preview">
                <span class="drop-icon">PR</span>
                <strong>产品组合图</strong>
                <small>点击或拖拽上传</small>
              </div>
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="section-head">
            <div class="step-badge">2</div>
            <div>
              <p class="section-label">生成设置</p>
              <h2>输出和文案</h2>
            </div>
          </div>

          <label class="field">
            <span>生成版本</span>
            <select id="modeInput">
              <option value="v1" selected>1.0 纯替换版</option>
              <option value="v2">2.0 融合版（测试中）</option>
            </select>
          </label>
          <label class="field">
            <span>输出尺寸</span>
            <select id="ratioInput">
              <option value="original" selected>保持原尺寸</option>
              <option value="16:9">16:9</option>
              <option value="3:4">3:4</option>
              <option value="1:1">1:1</option>
              <option value="9:16">9:16</option>
              <option value="4:5">4:5</option>
            </select>
          </label>
          <label class="field">
            <span>主标题</span>
            <input id="mainTitleInput" type="text" placeholder="可不填；填写后替换参考图主标题" />
          </label>
          <label class="field">
            <span>副标题</span>
            <input id="subTitleInput" type="text" placeholder="可不填；填写后替换参考图副标题" />
          </label>
          <label class="field quiet-field">
            <span>画面调整要求</span>
            <small class="quick-fill-help">填写默认选项；特殊产品摆放方式不适用默认选项</small>
            <div class="quick-fill-row" aria-label="默认风格">
              <button class="quick-fill-chip" type="button" data-fill="music">音乐氛围</button>
              <button class="quick-fill-chip" type="button" data-fill="summer">夏日氛围</button>
            </div>
            <textarea id="adjustInput" rows="7" placeholder="可以不填，例如：更高级、保留礼盒氛围、标题改新品发布、去掉价格区"></textarea>
          </label>
        </section>

        <button id="generateBtn" class="primary">生成</button>
        <div id="message" class="message"></div>
      </section>

      <section class="right">
        <section class="result-panel">
          <div class="result-head">
            <div>
              <p class="section-label">结果预览</p>
              <h2>生成后在这里查看</h2>
            </div>
            <a id="downloadLink" hidden download>下载图片</a>
          </div>
          <div id="resultPreview" class="result-preview">
            <div class="empty-state">
              <strong>等待生成</strong>
              <span>生成完成后，结果会出现在这里。</span>
            </div>
          </div>
        </section>
      </section>
    </main>

    <div id="imageModal" class="image-modal" hidden>
      <button id="modalClose" class="modal-close" type="button" aria-label="关闭大图">×</button>
      <img id="modalImage" alt="生成结果大图" />
    </div>

    <script src="fit-frame.js?v=20260707-biz-quiet-ui"></script>
    <script src="app.js?v=20260707-biz-quiet-ui"></script>
  </body>
</html>
