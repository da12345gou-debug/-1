<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTM运营工作台1.0版本</title>
    <link rel="stylesheet" href="/styles.css?v=20260707-login-title-compact" />
  </head>
  <body>
    <main class="login-view" id="loginView" aria-label="访问验证">
      <form class="login-card" id="unlockForm" method="post" action="/unlock">
        <p class="eyebrow">GTM Workspace</p>
        <h1>GTM运营工作台1.0版本</h1>
        <p>产品KV生成、落地页延展、产品替换、demo生成</p>
        <label>
          <span>访问密码</span>
          <input id="accessPassword" name="password" type="password" autocomplete="current-password" />
        </label>
        <button type="submit">进入工作台</button>
        <p class="message" id="unlockMessage" role="status"></p>
      </form>
    </main>

    <main class="shell is-hidden" id="workbenchView">
      <aside class="sidebar" aria-label="工具导航">
        <section class="brand">
          <p class="eyebrow">GTM Workspace</p>
          <h1>GTM运营工作台1.0版本</h1>
          <p>解决简单需求，包括产品聚合活动专题，无产品的落地页和demo生成。不适用于店铺首页和其他特殊运营活动。ps：每人每日生成限制为10张</p>
        </section>

        <nav class="tool-nav" aria-label="组合工具切换">
          <button class="tool-card active" type="button" data-tool="aggregate">
            <span>产品海报一键生成</span>
            <small>生成横版或者竖版的聚合KV</small>
          </button>
          <button class="tool-card" type="button" data-tool="copy">
            <span>DEMO一键生成</span>
            <small>你可以用它替换产品和融合参考图</small>
          </button>
          <button class="tool-card tool-card-testing" type="button" data-tool="landing">
            <span>落地页延展</span>
            <small>拖入KV和原型图就可以生成落地页</small>
            <i class="test-badge" aria-label="测试中">测试中</i>
          </button>
        </nav>

      </aside>

      <section class="workspace">
        <header class="workspace-head">
          <div>
            <p class="eyebrow" id="activeKind">Combined Copy</p>
            <h2 id="activeTitle">产品海报一键生成</h2>
            <p id="activeDesc">生成横版或者竖版的聚合KV。</p>
          </div>
        </header>

        <div class="frame-shell">
          <iframe id="toolFrame" title="组合工具预览"></iframe>
        </div>
      </section>
    </main>

    <script>window.__GTM_AUTH_STATE__ = __AUTH_STATE__;</script>
    <script src="/app.js?v=20260707-result-copy-final"></script>
  </body>
</html>
